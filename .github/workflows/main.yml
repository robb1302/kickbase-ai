name: Weekly Kickbase data update

on:
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update pipeline
        id: update
        continue-on-error: true
        run: bash update_kickbase.sh

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated daily data update"
            git push
          fi

      - name: Report update result
        if: always()
        env:
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          if [[ "$UPDATE_OUTCOME" == "failure" ]]; then
            echo "The update was partial. See the pipeline log for failed steps." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All update steps completed successfully." >> "$GITHUB_STEP_SUMMARY"
