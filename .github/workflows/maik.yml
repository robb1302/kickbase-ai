name: Monthly MAIK update

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-maik-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run MAIK score downloader
        run: python src/maiks_score_downloader.py

      - name: Run Ligainsider player downloader
        run: python src/ligainsider_player_downloader.py

      - name: Run Ligainsider matchday downloader
        run: python src/ligainsider_matchday_downloader.py

      - name: Run Kickbase downloader
        run: python src/kickbase_downloader.py

      - name: Merge downloaded player data
        run: python src/merger.py

      - name: Run starter update
        run: python src/set_starter.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated monthly MAIK update"
            git push
          fi
